<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength & Grace">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Strength & Grace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0F0F0F;color:#F0EBE5;font-family:Georgia,serif;max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100vh}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,select{font-family:-apple-system,system-ui,sans-serif;background:#1A1A1A;color:#F0EBE5;border:1px solid #3A3A3A;border-radius:10px;padding:10px 14px;font-size:14px;width:100%}
input:focus,select:focus{outline:none;border-color:#C4A882}
.sans{font-family:-apple-system,system-ui,sans-serif}

.header{padding:44px 24px 20px;border-bottom:1px solid #2E2E2E}
.header-label{font-size:10px;letter-spacing:3px;color:#8A8078;text-transform:uppercase;margin-bottom:6px;font-family:-apple-system,system-ui,sans-serif}
.header-title{font-size:26px;font-weight:300;color:#E8DDD0;line-height:1.2}
.header-title em{color:#C4A882;font-style:italic}
.header-sub{font-size:12px;color:#8A8078;margin-top:6px;font-family:-apple-system,system-ui,sans-serif}

.nav{display:flex;background:#1A1A1A;border-bottom:1px solid #2E2E2E;position:sticky;top:0;z-index:20}
.nav-btn{flex:1;padding:12px 1px;font-size:10px;color:#8A8078;border-bottom:2px solid transparent;font-family:-apple-system,system-ui,sans-serif}
.nav-btn.active{color:#E8DDD0;border-bottom-color:#C4A882}

.view{display:none}.view.active{display:block}
.pad{padding:24px}

.card{background:#1E1E1E;border:1px solid #2E2E2E;border-radius:16px;padding:16px 18px;margin-bottom:10px}

.btn{width:100%;padding:14px;border-radius:12px;font-size:14px;font-family:-apple-system,system-ui,sans-serif;transition:all 0.2s;text-align:center;display:block}
.btn-primary{background:#C4A882;color:#0F0F0F}
.btn-ghost{background:transparent;border:1px solid #3A3A3A;color:#8A8078}
.btn-success{background:#1A2A1A;border:1px solid #3A5A3A;color:#80C080}
.btn-danger{background:#2A1A1A;border:1px solid #5A3A3A;color:#C08080}
.btn-mob{background:#1A1A2A;border:1px solid #3A3A6A;color:#8080C0}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:10px 16px;border-radius:20px;font-size:13px;font-family:-apple-system,system-ui,sans-serif;border:1px solid #3A3A3A;color:#8A8078;background:#1A1A1A;transition:all 0.15s}
.chip.on{color:#0F0F0F;border-color:transparent;background:#C4A882}

.stepper-row{display:flex;align-items:center;gap:12px;margin:6px 0}
.stepper-btn{width:44px;height:44px;border-radius:50%;border:1px solid #3A3A3A;font-size:24px;color:#C4A882;display:flex;align-items:center;justify-content:center;background:#222;flex-shrink:0}
.stepper-val{font-size:26px;font-weight:300;color:#E8DDD0;min-width:60px;text-align:center}
.stepper-unit{font-size:13px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif}

.wq-row{display:flex;gap:6px;margin-top:8px}
.wq-btn{flex:1;padding:11px 4px;border-radius:10px;font-size:13px;font-family:-apple-system,system-ui,sans-serif;border:1px solid #3A3A3A;color:#8A8078;background:#1A1A1A;transition:all 0.15s;text-align:center}
.wq-btn.on{background:#C4A882;color:#0F0F0F;border-color:transparent}

.rep-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rc{padding:10px 12px;border-radius:10px;font-size:13px;font-family:-apple-system,system-ui,sans-serif;border:1px solid #3A3A3A;color:#8A8078;background:#1A1A1A;transition:all 0.15s}
.rc.on{color:#0F0F0F;border-color:transparent}

.lbl{font-size:11px;letter-spacing:1px;color:#8A8078;text-transform:uppercase;font-family:-apple-system,system-ui,sans-serif;margin-bottom:8px;margin-top:16px}

.howto-box{display:none;background:#141414;border-radius:10px;padding:12px 14px;border:1px solid #2A2A2A;margin:8px 0}
.howto-box.open{display:block}
.howto-text{font-size:13px;color:#C8C0B8;font-family:-apple-system,system-ui,sans-serif;line-height:1.6;margin-bottom:8px}
.howto-tip{display:flex;gap:6px;padding:7px 9px;border-radius:8px;font-size:12px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;line-height:1.5}

.note-box{background:#1A1800;border:1px solid #4A4000;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:12px;color:#C4A050;font-family:-apple-system,system-ui,sans-serif;line-height:1.5}

.studio-card{background:#1E1E1E;border:1px solid #2E2E2E;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.studio-card.on{border-color:#C4A882;background:#1E1A14}
.studio-dot{width:10px;height:10px;border-radius:50%;background:#3A3A3A;flex-shrink:0}
.studio-card.on .studio-dot{background:#C4A882}

.mob-ex{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1E1E1E}
.mob-ex:last-child{border-bottom:none}

.bar-row{display:flex;align-items:flex-end;gap:4px;height:56px;margin:10px 0}
.bar{flex:1;border-radius:4px 4px 0 0;min-width:8px;background:#C4A88240}
.bar.hi{background:#C4A882}
.bar-lbl{font-size:9px;color:#5A5450;font-family:-apple-system,system-ui,sans-serif;text-align:center;margin-top:3px}

.slider-wrap{display:flex;align-items:center;gap:10px;margin:6px 0}
.slider-wrap input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:#3A3A3A;border:none;padding:0;flex:1}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#C4A882;cursor:pointer}
.slider-num{font-size:18px;font-weight:300;color:#E8DDD0;min-width:28px;text-align:center}

.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#2A4A2A;border:1px solid #4A7A4A;color:#80C080;padding:9px 18px;border-radius:18px;font-size:13px;font-family:-apple-system,system-ui,sans-serif;opacity:0;transition:opacity 0.3s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#4A2A2A;border-color:#7A4A4A;color:#C08080}

.alt-panel{display:none;background:#0E0E1A;border:1px solid #2A2A4A;border-radius:12px;padding:10px;margin:6px 0}
.alt-panel.open{display:block}
.alt-item{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #2A2A3A;background:#141420;color:#8090C0;font-size:13px;font-family:-apple-system,system-ui,sans-serif;margin-bottom:5px;text-align:left;display:flex;justify-content:space-between}
.alt-item:last-child{margin-bottom:0}

.week-strip{display:flex;gap:4px;padding:12px 24px 0}
.wd{flex:1;background:#1A1A1A;border:1px solid #252525;border-radius:10px;padding:7px 2px;text-align:center}
.wd.today{border-color:#C4A882}
.wd.g-done{background:#0A1A0A;border-color:#2A5A2A}
.wd.b-done{background:#0A0A1A;border-color:#2A2A5A}
.wd-name{font-size:10px;font-weight:700;font-family:-apple-system,system-ui,sans-serif;margin-bottom:3px}
.wd-icon{font-size:15px;line-height:1}
.wd-check{font-size:10px;font-family:-apple-system,system-ui,sans-serif;margin-top:2px;height:14px}

.set-logged{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222}
.set-logged:last-child{border-bottom:none}

.prog-bar-wrap{background:#2E2E2E;border-radius:2px;height:3px;margin:6px 0 12px}
.prog-bar-fill{background:#C4A882;height:100%;border-radius:2px;transition:width 0.3s}
.sleep-card{background:#12141E;border:1px solid #2A2A4A;border-radius:14px;padding:16px 18px;margin-bottom:10px}
.sleep-badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;font-family:-apple-system,system-ui,sans-serif;margin-top:6px}
.sleep-good{background:#0A2A1A;border:1px solid #2A5A3A;color:#60C090}
.sleep-ok{background:#1A1A0A;border:1px solid #4A4A1A;color:#C0B060}
.sleep-low{background:#2A1A0A;border:1px solid #5A3A1A;color:#C07040}
.sleep-poor{background:#2A0A0A;border:1px solid #5A2A2A;color:#C06060}
.star-row{display:flex;gap:6px;margin-top:4px}
.star-btn{width:36px;height:36px;border-radius:50%;border:1px solid #3A3A4A;background:#1A1A2A;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.star-btn.on{background:#2A2A5A;border-color:#5A5ACA}
.block-gap{height:28px}
.block-title{font-size:13px;letter-spacing:2px;color:#8A8078;text-transform:uppercase;font-family:-apple-system,system-ui,sans-serif;margin-bottom:10px}
</style>
</head>
<body>

<div class="header">
  <div class="header-label">Dein Trainingssystem</div>
  <h1 class="header-title">Strength &<br><em>Grace</em></h1>
  <p class="header-sub" id="hdr-sub">Mo · Mi · Fr -- Studio · 90 Tage</p>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="NAV('plan')">Plan</button>
  <button class="nav-btn" onclick="NAV('workout')">Training</button>
  <button class="nav-btn" onclick="NAV('mobility')">Mobility</button>
  <button class="nav-btn" onclick="NAV('body')">Körper</button>
  <button class="nav-btn" onclick="NAV('stats')">Stats</button>
  <button class="nav-btn" onclick="NAV('sleep')">Schlaf</button>
  <button class="nav-btn" onclick="NAV('more')">Mehr</button>
</div>

<div id="view-plan" class="view active"><div id="plan-content"></div></div>
<div id="view-workout" class="view"><div id="workout-content"></div></div>
<div id="view-mobility" class="view"><div id="mob-content"></div></div>
<div id="view-body" class="view"><div id="body-content"></div></div>
<div id="view-stats" class="view"><div id="stats-content"></div></div>
<div id="view-sleep" class="view"><div id="sleep-content"></div></div>
<div id="view-more" class="view"><div id="more-content"></div></div>

<div class="toast" id="toast"></div>

<script>
var SK='sg_v4';

// ---- SLOTS ----
var SLOTS={
  HIP_THRUST:{label:'Hip Thrust',color:'#C4A882',def:'Hip Thrust Maschine',
    alts:['Booty Builder Hip Thrust Elite','Booty Builder Dual Hip Thrust','Smith Machine Hip Thrust','Barbell Hip Thrust','Dumbbell Hip Thrust'],
    howto:{'Hip Thrust Maschine':'Rücken gegen Polsterung. Füße hüftbreit auf Plattform. Po explosiv hoch bis Knie-Hüfte-Schulter in einer Linie. 1 Sek halten. Tip: Kinn zur Brust. Po zusammenkneifen. Durch Fersen drücken.',
    'Booty Builder Hip Thrust Elite':'Wie Hip Thrust Maschine, duales Pad für mehr Stabilität. Tip: Breitere Auflage -- mehr Kontrolle bei der Beckenbewegung.',
    'Barbell Hip Thrust':'Bank, Langhantel mit Pad auf Hüften. Standard Hip Thrust. Tip: Klassik -- mehr Setup-Zeit, beste Bewegungsfreiheit.',
    'Smith Machine Hip Thrust':'Stange in Smith-Führung auf Hüften. Tip: Führung erlaubt mehr Fokus auf Kontraktion.'}
  },
  HIP_HINGE:{label:'Hip Hinge / RDL',color:'#A89070',def:'Romanian Deadlift',
    alts:['Barbell RDL','Smith Machine RDL','Cable Pull-Through'],
    howto:{'Romanian Deadlift':'Hüftbreit stehen. Rücken gerade, Knie minimal gebeugt. Oberkörper kippt nach vorn -- Hüfte nach hinten. Dehnung in Hamstrings. Aus Hüfte aufrichten. Tip: Keine Kniebeuge! Hanteln nah am Körper.',
    'Cable Pull-Through':'Kabel niedrig. Griff zwischen Beinen. Hüfte nach hinten, dann vorschießen. Arme gerade. Tip: Kein Rücken -- reine Glute-/Hamstring-Arbeit. Gut bei LWS.'}
  },
  LEG_PRESS:{label:'Leg Press',color:'#9A8A7A',def:'Leg Press Glute-Fokus',
    alts:['Horizontal Leg Press','45° Leg Press','Hack Squat'],
    howto:{'Leg Press Glute-Fokus':'Füße weit oben auf Plattform. Schulterbreit, Zehen leicht nach außen. Tief senken bis Hüfte leicht einrollt. Durch Fersen hochdrücken. Tip: Fuß oben = mehr Glutes. Tief = mehr Glutes.',
    '45° Leg Press':'Schraege Plattform. Gleiche Fußposition oben. Tip: Klassische Variante -- guter Kompromiss.'}
  },
  SQUAT:{label:'Squat Muster',color:'#8A9A8A',def:'Belt Squat',
    alts:['Hack Squat','Pendulum Squat','Goblet Squat'],
    howto:{'Belt Squat':'Gurt um Hüften. Füße schulterbreit, Zehen 10-30° nach außen, leicht vor Zuglinie. Tief kontrolliert senken. Oben Po anspannen ohne Hohlkreuz. Tip: Nach Satz 1 Po + Beine spüren -- nicht Rücken.',
    'Hack Squat':'Schultern gegen Pads. Füße schulterbreit. Tief senken, explosiv hoch. Tip: Mehr Quad. Gut wenn Belt Squat besetzt.',
    'Goblet Squat':'Hantel vor Brust. Füße schulterbreit. Tief. Tip: Gut für Technik und Mobilität.'}
  },
  HIP_ABDUCTION:{label:'Hip Abduction',color:'#B0A060',def:'Abduktionsmaschine',
    alts:['Booty Builder 3D Multi Abductor','Standing Cable Hip Abduction','Side-Lying Hip Abduction mit Band'],
    howto:{'Abduktionsmaschine':'Aufrecht sitzen. Knie gegen Pads. Langsam nach außen öffnen. 1-2 Sek halten. Kontrolliert zurück -- nicht ganz schließen. Tip: Der Rückweg (exzentrisch) baut Muskelmasse. Langsam ist besser.',
    'Booty Builder 3D Multi Abductor':'Dreidimensionaler Widerstand. Bewegung wie Abduktion, zusaetzliche Rotationskomponente. Tip: Geringeres Gewicht als normale Maschine. Trifft Gluteus Medius aus mehreren Winkeln.',
    'Standing Cable Hip Abduction':'Kabel auf Knöchelhoehe. Bein seitlich nach außen. Kontrolliert zurück. Tip: Kleine Bewegung. Hüfte stabil.'}
  },
  GLUTE_ISO:{label:'Glute Isolation',color:'#C09060',def:'Cable Kickback diagonal',
    alts:['Cable Kickback gerade','Booty Builder Pendulum Kickback','Booty Builder Kneeling Glute Isolator','Band Kickback'],
    howto:{'Cable Kickback diagonal':'Kabel, Schlaufe um Knöchel. Leicht nach vorn gebeugt. Bein diagonal nach hinten-oben. Po anspannen. Tip: Diagonal trifft obere + seitliche Fasern. Hüfte nicht kippen.',
    'Cable Kickback gerade':'Wie diagonal, aber gerade nach hinten. Tip: Trifft Gluteus Maximus zentral. Gut für Freitag.',
    'Booty Builder Pendulum Kickback':'Knie auf Pad. Pendelmechanik. Po am höchsten Punkt maximal anspannen. Tip: Bessere Exzentrik als normaler Kickback.',
    'Booty Builder Kneeling Glute Isolator':'Kniend. Bein in Mechanismus. Streckbewegung gegen Widerstand. Tip: Maximale Isolation.'}
  },
  STEP_UP:{label:'Step-Up',color:'#8A9070',def:'Step-Up',
    alts:['Dumbbell Step-Up'],
    howto:{
      'Step-Up':'Fuß komplett auf Erhöhung setzen. Aus der Ferse des oberen Fußes hochdrücken — das untere Bein hilft nicht. Oben kurz einbeinig stehen. Kontrolliert senken. Tip: Höherer Step = mehr Glutes. Gewicht auf oberem Bein lassen.',
      'Dumbbell Step-Up':'Wie Bodyweight Step-Up, Hanteln in jeder Hand. Tip: Rumpf stabil halten, nicht zur Seite kippen.'
    }
  },
  LUNGE:{label:'Reverse Lunge',color:'#8A8870',def:'Reverse Lunge',
    alts:['Dumbbell Reverse Lunge','Smith Machine Reverse Lunge'],
    howto:{
      'Reverse Lunge':'Schritt nach hinten. Hinteres Knie zur Erde senken. Vorderes Knie über Fuß. Aus Ferse des vorderen Fußes hochdrücken. Tip: Aufrechter Oberkörper. Weiter Schritt = mehr Glutes.',
      'Dumbbell Reverse Lunge':'Wie Reverse Lunge, Hanteln in jeder Hand. Tip: Rumpf extra stabil halten.',
      'Smith Machine Reverse Lunge':'Stange auf Schultern. Schritt nach hinten unter Führung. Gut für höhere Lasten.'
    }
  },
  LEG_CURL:{label:'Leg Curl',color:'#7A8A8A',def:'Seated Leg Curl',
    alts:['Lying Leg Curl','Single-Leg Curl'],
    howto:{
      'Seated Leg Curl':'Aufrecht sitzen, Rücken an Lehne. Beine unter das Pad. Kontrolliert beugen bis ca. 90°. 1 Sek halten. Langsam strecken. Tip: Sitzend oft effektiver wegen Hüftposition — Kniebeugung unter Hüftbeugung.',
      'Lying Leg Curl':'Bauch auf Polsterung. Fersen unter das Pad klemmen. Beugen bis Oberschenkel kaum vom Pad hebt. Langsam strecken. Tip: Hüften bleiben auf der Bank. Langsames Strecken = mehr Reiz.',
      'Single-Leg Curl':'Wie Lying Curl, aber ein Bein. Andere Seite entspannt. Tip: Gut für Seitenunterschiede. Gewicht deutlich reduzieren.'
    }
  },
  LAT_PULL:{label:'Lat Pulldown',color:'#7090A0',def:'Lat Pulldown',
    alts:['Close-Grip Lat Pulldown'],
    howto:{'Lat Pulldown':'Breiter Griff. Leicht nach hinten. Stange zur oberen Brust -- Ellbogen nach unten und außen. Tip: Du drückst Ellbogen nach unten, nicht die Stange.'}
  },
  CABLE_ROW:{label:'Cable Row',color:'#607090',def:'Seated Cable Row',
    alts:['Chest-Supported Row'],
    howto:{'Seated Cable Row':'Aufrecht sitzen. Griff zur Körpermitte. Schulterblatt 1 Sek zusammen. Kontrolliert vor. Tip: Kein Schwung. Arme ziehen, Rücken stabilisiert.'}
  },
  CHEST_PRESS:{label:'Chest Press',color:'#807090',def:'Incline Chest Press Maschine',
    alts:['Dumbbell Incline Press'],
    howto:{'Incline Chest Press Maschine':'Rückenlehne 30-45°. Kontrolliert drücken. Langsam zurück. Tip: Schulterblatt zusammen und in Lehne. Schutzt Schultern.'}
  },
  LATERAL:{label:'Lateral Raise',color:'#907080',def:'Dumbbell Lateral Raise',
    alts:['Cable Lateral Raise'],
    howto:{'Dumbbell Lateral Raise':'Stehend. Hanteln seitlich. Leicht gebeugte Ellbogen. Bis Schulterhöhe. Kontrolliert senken. Tip: Kleiner Finger oben. Kein Schwingen.'}
  },
  PALLOF:{label:'Pallof Press',color:'#608060',def:'Pallof Press',
    alts:[],
    howto:{'Pallof Press':'Band oder Kabel seitlich. Arme nach vorn drücken. 2 Sek halten. Tip: Core verhindert Rotation. Je weiter weg, desto schwerer.'}
  },
  CORE:{label:'Core Kontrolle',color:'#608080',def:'Dead Bug',
    alts:['Bird Dog'],
    howto:{'Dead Bug':'Rücklage. Arme zur Decke. Beine 90°. Arm + Gegenüberliegendes Bein Richtung Boden. Rücken flach. Tip: Tief atmen. Langsam.',
    'Bird Dog':'Auf allen Vieren. Arm + gegenüberliegendes Bein strecken. 2 Sek. Tip: Glas Wasser auf dem Rücken vorstellen.'}
  },
  ZONE2:{label:'Zone 2 Cardio',color:'#607070',def:'Incline Treadmill Walking',
    alts:['Bike','Elliptical','Outdoor Walking'],
    howto:{
      'Incline Treadmill Walking':'10-12% Steigung, 3-4 km/h. Aufrecht gehen — nicht am Griff festhalten (das nimmt die Belastung raus). Tip: Ziel: Puls 120-140 bpm. Du könntest noch ganze Sätze sprechen.',
      'Bike':'Moderates Tempo, Puls 120-140 bpm. Sattel so einstellen dass Knie bei voller Streckung leicht gebeugt bleibt. Tip: Gelenkschonend. Gut als Alternative.',
      'Elliptical':'Moderates Tempo, Arme mitschwingen lassen. Puls 120-140 bpm. Tip: Ganzkörper-Zone-2 mit wenig Gelenkbelastung.',
      'Outdoor Walking':'Zügiges Gehen draußen, leicht bergige Route ideal. Tip: Frische Luft als Bonus. Puls mit Hand kurz messen wenn kein Tracker.'
    }
  },
  IMPACT:{label:'Seilspringen / Impact',color:'#806060',def:'Jump Rope',
    alts:['Pogo Hops','Step-Up Impact'],
    howto:{
      'Jump Rope':'Wo 1-2: 3x20 Sek, Wo 3-4: 3x30 Sek, ab Wo 5: 3x45 Sek. Weich landen, Vorfuß zuerst, Knie leicht gebeugt. Tip: Knochenreiz, kein Ausdauertraining. Kurze Pausen.',
      'Pogo Hops':'Kleine beidbeinige Sprünge auf der Stelle, 3x10 Wdh. Weich landen. Tip: Wenn Seilspringen unangenehm.',
      'Step-Up Impact':'Zügiges Treppensteigen oder Step-Ups. Tip: Alternative wenn Sprünge nicht gehen.'
    }
  }
};

// ---- WARMUP ----
var WARMUPS={
  monday:{label:'Warm-Up Montag',duration:'6-8 Min',exercises:[
    {name:'Laufband / Fahrrad',detail:'3 Min locker',how:'Locker bewegen und Körpertemperatur erhöhen. Noch kein Cardio-Training.',tip:'Tempo so, dass du problemlos sprechen könntest.'},
    {name:'Ankle Rocks',detail:'10/Seite',how:'Im Ausfallschritt Knie kontrolliert über die Zehen nach vorne bewegen. Ferse bleibt am Boden.',tip:'Sprunggelenk vorbereiten für Leg Press und RDL.'},
    {name:'90/90 Hip Switch',detail:'8/Seite',how:'Sitzend beide Knie kontrolliert von einer Seite zur anderen führen. Oberkörper möglichst ruhig.',tip:'Hüftrotation mobilisieren.'},
    {name:'Adductor Rock Back',detail:'8/Seite',how:'Vierfüßler: ein Bein seitlich ausstrecken. Hüfte langsam nach hinten schieben und wieder vor. Rücken neutral.',tip:'Hüfte und Innenschenkel dynamisch vorbereiten.'},
    {name:'Bodyweight Hip Hinge',detail:'8 Wdh',how:'Hände an die Hüfte, Knie leicht gebeugt. Po nach hinten schieben, ohne die LWS zu überstrecken oder rund zu werden.',tip:'Bewegungsmuster für RDL vorbereiten.'},
    {name:'Bodyweight Deep Squat',detail:'5 Wdh · 2-3 Sek unten',how:'Kontrolliert tief gehen, ganze Fußsohle belastet, Knie folgen den Zehen. Unten 2-3 Sek bleiben.',tip:'Vorbereitung auf Leg Press und Hüftflexion allgemein.'}

var DB={
  load:function(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return{};}},
  save:function(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}},
  get:function(path,def){
    var d=this.load(),parts=path.split('.'),cur=d;
    for(var i=0;i<parts.length;i++){if(cur==null||typeof cur!=='object')return def!=null?def:null;cur=cur[parts[i]];}
    return cur!=null?cur:(def!=null?def:null);
  },
  set:function(path,val){
    var d=this.load(),parts=path.split('.'),cur=d;
    for(var i=0;i<parts.length-1;i++){if(!cur[parts[i]])cur[parts[i]]={};cur=cur[parts[i]];}
    cur[parts[parts.length-1]]=val;this.save(d);
  },
  push:function(path,val){var a=this.get(path,[])||[];a.push(val);this.set(path,a);},
  today:function(){return new Date().toISOString().split('T')[0];},
  migrate:function(){
    var old=localStorage.getItem('sg_v3');
    if(old&&!this.get('_mig')){
      try{var o=JSON.parse(old);var d=this.load();d.legacy=o;d._mig=true;this.save(d);}catch(e){}
    }
  }
};

function checkProg(exName,template){
  var last=getLastSession(exName);
  if(!last||!last.sets||!last.sets.length)return null;
  var reps=template.reps||'8-12';
  var parts=reps.split('-');
  var maxR=parseInt(parts[parts.length-1])||12;
  var allMax=last.sets.every(function(s){return s.reps>=maxR&&s.rir<=2;});
  if(allMax){
    var w=(last.sets[0].weight||0)+5;
    return{ok:true,msg:'Alle Sätze bei '+maxR+' Wdh -- Gewicht auf '+w+' kg erhöhen',w:w};
  }
  return{ok:false,msg:'Weiter bei '+(last.sets[0]?last.sets[0].weight||'--':'--')+' kg'};
}

function getSleepLog(){return DB.get('sleepLog',{});}
function getTodaySleep(){return DB.get('sleepLog.'+DB.today(),null);}

function saveSleep(hours,mins,quality,energy){
  DB.set('sleepLog.'+DB.today(),{
    date:DB.today(),h:parseInt(hours)||0,m:parseInt(mins)||0,
    quality:parseInt(quality)||0,energy:parseInt(energy)||0,
    ts:new Date().toISOString()
  });
  toast('Schlaf gespeichert ✓');
}

function getSleepMinutes(entry){
  if(!entry)return null;
  return (entry.h||0)*60+(entry.m||0);
}

function sleepLabel(mins){
  if(mins===null||mins===undefined)return'';
  if(mins<360)return'sleep-poor';
  if(mins<420)return'sleep-low';
  if(mins<540)return'sleep-good';
  return'sleep-ok';
}

function sleepRec(sleepEntry,energy,lwsVal){
  if(!sleepEntry)return null;
  var mins=getSleepMinutes(sleepEntry);
  var q=sleepEntry.quality||0;
  var e=energy||sleepEntry.energy||0;
  var score=0;
  if(mins>=420)score+=2;else if(mins>=360)score+=1;
  if(q>=4)score+=2;else if(q>=3)score+=1;
  if(e>=4)score+=2;else if(e>=3)score+=1;
  if(lwsVal&&lwsVal>=6)score-=2;
  if(score>=5)return{text:'Normal trainieren',cls:'sleep-good'};
  if(score>=3)return{text:'Tagesform beobachten',cls:'sleep-ok'};
  if(score>=1)return{text:'Leichter trainieren heute',cls:'sleep-low'};
  return{text:'Regeneration priorisieren',cls:'sleep-poor'};
}

function avgSleep(days){
  var log=getSleepLog();var vals=[];
  var today=new Date();
  for(var i=0;i<days;i++){
    var d=new Date(today);d.setDate(today.getDate()-i);
    var dk=d.toISOString().split('T')[0];
    var e=log[dk];if(e&&getSleepMinutes(e)>0)vals.push(getSleepMinutes(e));
  }
  if(!vals.length)return null;
  return Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
}

function fmtMins(mins){
  if(!mins&&mins!==0)return'--';
  return Math.floor(mins/60)+'h '+Math.round(mins%60)+'min';
}

function getWorkoutRIRAvg(dateStr){
  var hist=DB.get('hist',{});
  var allRIR=[];
  var keys=Object.keys(hist);
  for(var i=0;i<keys.length;i++){
    var entries=hist[keys[i]]||[];
    for(var j=0;j<entries.length;j++){
      if(entries[j].date===dateStr&&entries[j].sets){
        for(var k=0;k<entries[j].sets.length;k++){
          if(entries[j].sets[k].rir!=null)allRIR.push(entries[j].sets[k].rir);
        }
      }
    }
  }
  if(!allRIR.length)return null;
  return Math.round((allRIR.reduce(function(a,b){return a+b;},0)/allRIR.length)*10)/10;
}

function getWorkoutVolume(dateStr){
  var hist=DB.get('hist',{});
  var totalSets=0;var keys=Object.keys(hist);
  for(var i=0;i<keys.length;i++){
    var entries=hist[keys[i]]||[];
    for(var j=0;j<entries.length;j++){
      if(entries[j].date===dateStr)totalSets+=(entries[j].sets||[]).length;
    }
  }
  return totalSets;
}

function getInsight(){
  var log=getSleepLog();
  var sessions=DB.get('sessions',{});
  var good=[],low=[];// {rirAvg, volume}
  var dates=Object.keys(log);
  for(var i=0;i<dates.length;i++){
    var dk=dates[i];
    var entry=log[dk];
    var sess=sessions[dk];
    if(!entry||!sess||!sess.done)continue;
    var mins=getSleepMinutes(entry);
    var rirAvg=getWorkoutRIRAvg(dk);
    if(rirAvg===null)continue;
    if(mins>=420)good.push(rirAvg);
    else if(mins<420)low.push(rirAvg);
  }
  if(good.length<3||low.length<3)return null;
  var avgGood=Math.round((good.reduce(function(a,b){return a+b;},0)/good.length)*10)/10;
  var avgLow=Math.round((low.reduce(function(a,b){return a+b;},0)/low.length)*10)/10;
  if(avgGood<avgLow-0.2){
    return'Nach ≥7h Schlaf lag dein Ø RIR bei '+avgGood+' — nach <7h bei '+avgLow+'. Ausreichend Schlaf zeigt in deinen Daten bessere Trainingsleistung.';
  }
  return null;
}

function getWeekNumber(d){
  var date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  date.setUTCDate(date.getUTCDate()+4-(date.getUTCDay()||7));
  var yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function retroLog(){
  var dayKey=document.getElementById('retro-day').value;
  if(!dayKey){toast('Tag wählen',true);return;}
  // Auto-detect workout type from day of week
  var dow=new Date(dayKey+'T12:00:00').getDay();
  var dayWorkout={1:'monday',3:'wednesday',5:'friday'};
  var dayMob={2:'tuesday',4:'thursday',6:'saturday'};
  var type=dayWorkout[dow]||null;
  var isMob=!!dayMob[dow];
  if(!type&&!isMob){toast('An diesem Tag kein Training geplant (Ruhetag)',true);return;}
  if(isMob&&!type){
    DB.set('mobDone.'+dayKey+'.retro',true);
    toast('Mobility für '+dayKey+' eingetragen ✓');
  }else{
    DB.set('sessions.'+dayKey,{day:type,studio:getActiveStudio(),done:true,completion:100,actual:100,retro:true,ts:new Date().toISOString()});

  }

}

    // Logged sets
    var sets=WS.sets[WS.idx]||[];
    if(sets.length){
      html+='<div style="background:#1A1A1A;border-radius:10px;padding:8px 12px;margin-bottom:10px">';
      for(var si=0;si<sets.length;si++){
        html+='<div class="set-logged"><span style="font-size:12px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;width:36px">S'+(si+1)+'</span><span style="font-size:14px;color:#80C080;font-family:-apple-system,system-ui,sans-serif;flex:1">'+(sets[si].weight||'--')+'kg x '+sets[si].reps+' <span style="font-size:11px;color:#5A8050">RIR '+sets[si].rir+'</span></span><button onclick="removeSet('+si+')" style="font-size:16px;color:#5A3030">x</button></div>';
      }
      html+='</div>';
    }

    if(sets.length<slot.sets){
      var sn=sets.length+1;
      var curW=PS.weight!=null?PS.weight:(sets.length?sets[sets.length-1].weight:null);
      var rStr=slot.reps||'8-12';var rParts=rStr.split('-');var rMin=parseInt(rParts[0])||6;var rMax=parseInt(rParts[1]||rParts[0])||12;
      var repOpts=[];for(var r=Math.max(1,rMin-2);r<=rMax+3;r++)repOpts.push(r);
      html+='<div style="background:#181616;border-radius:12px;padding:12px;margin-bottom:10px">';
      html+='<div class="lbl" style="margin-top:0">Satz '+sn+' von '+slot.sets+'</div>';
      html+='<div class="lbl">Gewicht (kg)</div>';
      html+='<div class="stepper-row"><button class="stepper-btn" onclick="adjW(-1)">-</button><div class="stepper-val" id="wval">'+(curW!=null?curW:'--')+'</div><button class="stepper-btn" onclick="adjW(1)">+</button><span class="stepper-unit">kg</span></div>';
      html+='<div class="wq-row"><button class="wq-btn'+(curW===2.5?' on':'')+'" onclick="setW(2.5)">2.5</button><button class="wq-btn'+(curW===5?' on':'')+'" onclick="setW(5)">5</button><button class="wq-btn'+(curW===7.5?' on':'')+'" onclick="setW(7.5)">7.5</button><button class="wq-btn'+(curW===10?' on':'')+'" onclick="setW(10)">10</button></div>';
      html+='<div class="lbl">Wiederholungen</div><div class="rep-row" id="rep-row">';
      for(var ri2=0;ri2<repOpts.length;ri2++){var rv=repOpts[ri2];html+='<button class="rc'+(PS.reps===rv?' on':'')+'" onclick="setReps('+rv+')" id="rc-'+rv+'">'+(PS.reps===rv?'<b>':'')+rv+(PS.reps===rv?'</b>':'')+'</button>';}
      html+='</div>';
      html+='<div class="lbl">RIR</div><div class="chip-row">';
      for(var rv2=0;rv2<=4;rv2++){html+='<button class="chip'+(PS.rir===rv2?' on':'')+'" onclick="setRIR('+rv2+')" id="rir-'+rv2+'">'+rv2+'</button>';}
      html+='</div>';
      html+='<button class="btn btn-success" style="margin-top:12px" onclick="logSet()">Satz '+sn+' speichern</button>';
      html+='<button class="btn btn-ghost" style="margin-top:6px;font-size:12px;padding:9px" onclick="finishSetsEarly()">Weniger Sätze heute — Übung abschließen</button>';
      html+='</div>';
    }else{
      html+='<button class="btn btn-primary" onclick="completeSlot()">Weiter</button>';
    }

    if(slot.note)html+='<div class="note-box">'+slot.note+'</div>';

    // Technique
    var hw='';
  if(slotDef&&slotDef.howto){
    if(slotDef.howto[exName]){
      hw=slotDef.howto[exName];
    }else{
      // Fallback: use default exercise howto
      var defHw=slotDef.howto[slotDef.def];
      if(defHw)hw='(Anleitung für '+slotDef.def+') '+defHw;
    }
  }
    if(hw){
      html+='<button class="btn btn-ghost" style="margin-top:8px;font-size:12px;padding:10px" onclick="toggleHowto()">Ausführung anzeigen</button>';

    }

    // Cardio/Impact
    html+='<div style="font-size:14px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;margin-bottom:12px">'+(slot.duration||slot.note||'')+'</div>';
    html+='<button class="btn btn-success" onclick="completeSlot()">Erledigt</button>';
  }
  html+='</div>';

  // Alt / Defer buttons
  html+='<div style="padding:0 24px;display:flex;gap:8px;margin-bottom:6px"><button class="btn btn-ghost" style="font-size:12px;padding:10px" onclick="toggleAlt()">Alternative</button><button class="btn btn-ghost" style="font-size:12px;padding:10px" onclick="deferSlot()">Gerät besetzt</button></div>';
  html+='<div id="alt-panel" class="alt-panel" style="margin:0 24px">';
  if(slotDef&&slotDef.alts){
    for(var ai=0;ai<slotDef.alts.length;ai++){
      var alt=slotDef.alts[ai];
      if(alt!==exName){html+='<button class="alt-item" onclick="substituteEx(\''+alt.replace(/'/g,"\\'")+'\')" ><span>'+alt+'</span><span style="font-size:10px;color:#6060A0;background:#0A0A1A;padding:2px 7px;border-radius:6px">wählen</span></button>';}
    }
  }
  html+='</div>';

  // Deferred list
  if(WS.deferred.length){
    html+='<div style="padding:6px 24px"><div class="lbl" style="margin-top:6px">Verschoben:</div>';
    for(var di=0;di<WS.deferred.length;di++){
      var dIdx=WS.deferred[di];var ds=tmpl.slots[dIdx];var dn2=WS.subs[dIdx]||bestEx(ds.slot,WS.studio);
      html+='<button class="alt-item" onclick="jumpTo('+dIdx+')" style="margin-bottom:4px"><span>'+dn2+'</span><span style="font-size:10px;color:#6060A0;background:#0A0A1A;padding:2px 7px;border-radius:6px">jetzt</span></button>';
    }
    html+='</div>';
  }

  // Back button
  if(WS.idx>0)html+='<div style="padding:4px 24px"><button class="btn btn-ghost" style="font-size:12px;padding:10px" onclick="prevSlot()">Zurück</button></div>';

  document.getElementById('workout-content').innerHTML=html;
}

function toggleDayPreview(day){
  WS.previewDay=(WS.previewDay===day?null:day);
  renderWorkout();
}

function beginWorkout(day){
  // Block starting new workout if one is already active/saved
  if(WS._savedState){
    toast('Bitte erst offenes Training beenden oder verwerfen',true);
    return;
  }
  startWorkout(day,getActiveStudio());
}

function resumeWorkout(){
  if(WS._savedState){
    var s=WS._savedState;
    WS={active:true,day:s.day,studio:s.studio,idx:s.idx,sets:s.sets,subs:s.subs,skipped:s.skipped,deferred:s.deferred,startTime:s.startTime,previewDay:null};
    WS._savedState=null;
    PS={};
    renderWorkout();
  }
}

function discardWorkout(){
  WS._savedState=null;
  WS.previewDay=null;
  renderWorkout();
  toast('Training verworfen');
}

function editSessionExercise(exName, dateStr){
  // Find the entry in history and open an edit panel
  var hist=DB.get('hist.'+exName,[]);
  var entryIdx=-1;
  for(var i=0;i<hist.length;i++){if(hist[i].date===dateStr){entryIdx=i;break;}}
  if(entryIdx<0){toast('Kein Eintrag gefunden',true);return;}
  var entry=hist[entryIdx];

  // Create edit overlay
  var old2=document.getElementById('edit-session-panel');if(old2)old2.remove();
  var overlay=document.createElement('div');
  overlay.id='edit-session-panel';
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000000BB;z-index:200;box-sizing:border-box;';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};

  var panel=document.createElement('div');
  panel.style.cssText='background:#1E1E1E;border:1px solid #3A3A3A;border-radius:18px;padding:20px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-sizing:border-box;';

  var title=document.createElement('div');
  title.textContent=exName+' bearbeiten';
  title.style.cssText='font-size:16px;color:#E8DDD0;margin-bottom:4px;font-weight:300;';

  var subtitle=document.createElement('div');
  subtitle.textContent=dateStr;
  subtitle.style.cssText='font-size:11px;color:#8A8078;font-family:-apple-system,sans-serif;margin-bottom:14px;';

  panel.appendChild(title);panel.appendChild(subtitle);

  // Build set rows
  var sets=entry.sets||[];
  var setContainer=document.createElement('div');
  setContainer.id='edit-sets-container';
  for(var si=0;si<sets.length;si++){
    setContainer.appendChild(buildEditSetRow(si,sets[si]));
  }
  panel.appendChild(setContainer);

  // Add set button
  var addBtn=document.createElement('button');
  addBtn.textContent='+ Satz hinzufügen';
  addBtn.className='btn btn-ghost';
  addBtn.style.cssText='font-size:12px;padding:8px;margin-top:6px;';
  addBtn.onclick=function(){
    var sc=document.getElementById('edit-sets-container');
    var newIdx=sc.children.length;
    var lastSet=sets[sets.length-1]||{weight:0,reps:8,rir:2};
    sc.appendChild(buildEditSetRow(newIdx,{weight:lastSet.weight,reps:lastSet.reps,rir:lastSet.rir}));
  };
  panel.appendChild(addBtn);

  // Save button
  var saveBtn=document.createElement('button');
  saveBtn.textContent='Speichern';
  saveBtn.className='btn btn-primary';
  saveBtn.style.cssText='margin-top:12px;font-size:14px;';
  saveBtn.onclick=function(){
    var rows=document.querySelectorAll('.edit-set-row');
    var newSets=[];
    for(var ri=0;ri<rows.length;ri++){
      var w=parseFloat(rows[ri].querySelector('.edit-w').value)||0;
      var r2=parseInt(rows[ri].querySelector('.edit-r').value)||0;
      var rir=parseInt(rows[ri].querySelector('.edit-rir').value)||0;
      if(r2>0)newSets.push({weight:w,reps:r2,rir:rir});
    }
    hist[entryIdx].sets=newSets;
    DB.set('hist.'+exName,hist);
    overlay.remove();
    toast('Gespeichert');
    renderWorkout();
  };

  var cancelBtn=document.createElement('button');
  cancelBtn.textContent='Abbrechen';
  cancelBtn.className='btn btn-ghost';
  cancelBtn.style.cssText='margin-top:6px;font-size:13px;';
  cancelBtn.onclick=function(){overlay.remove();};

  panel.appendChild(saveBtn);panel.appendChild(cancelBtn);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

    +'<input class="edit-w" type="number" value="'+(set.weight||0)+'" placeholder="kg" style="width:70px;padding:7px;font-size:13px;border-radius:8px;background:#141414;color:#E8DDD0;border:1px solid #3A3A3A;">'
    +'<span style="font-size:11px;color:#5A5450;font-family:-apple-system,sans-serif">kg</span>'

function deleteSession(day){
  var today=DB.today();
  var sess=DB.get('sessions.'+today,null);
  if(sess&&sess.day===day){
    var d=DB.load();
    if(d.sessions)delete d.sessions[today];
    DB.save(d);
    toast('Training gelöscht');
    renderWorkout();
    renderPlan();
  } else {
    toast('Kein Training für heute gefunden',true);
  }
}

function startWorkout(day,studioId){
  var savedWuChecked=DB.get('wuChecked.'+DB.today(),{});
  var savedWuDone=DB.get('wuDone.'+DB.today(),false);
  WS={active:true,day:day,studio:studioId,idx:0,sets:{},subs:{},skipped:[],deferred:[],startTime:Date.now(),partial:{},_savedState:null,previewDay:null,wuChecked:savedWuChecked,wuDone:savedWuDone};
  PS={};
  NAV('workout');
}
function toggleHowto(){var b=document.getElementById('howto-box');if(b)b.classList.toggle('open');}
function toggleAlt(){var p=document.getElementById('alt-panel');if(p)p.classList.toggle('open');}
function substituteEx(name){WS.subs[WS.idx]=name;PS={};renderWorkout();toast('Gewechselt: '+name);}
function deferSlot(){WS.deferred.push(WS.idx);WS.idx++;PS={};renderWorkout();toast('Verschoben');}
function jumpTo(idx){WS.deferred=WS.deferred.filter(function(d){return d!==idx;});WS.idx=idx;PS={};renderWorkout();}
function prevSlot(){if(WS.idx>0){WS.idx--;PS={};renderWorkout();}}
function skipSlot(){WS.skipped.push(WS.idx);WS.idx++;PS={};renderWorkout();}

function adjW(dir){
  var cur=PS.weight!=null?PS.weight:0;
  var nw=Math.max(0,Math.round((cur+dir*5)*10)/10);
  PS.weight=nw;
  var el=document.getElementById('wval');if(el)el.textContent=nw||'--';
  document.querySelectorAll('.wq-btn').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.wq-btn').forEach(function(b){if(parseFloat(b.textContent)==nw)b.classList.add('on');});
}
function setW(w){
  PS.weight=w;
  var el=document.getElementById('wval');if(el)el.textContent=w;
  document.querySelectorAll('.wq-btn').forEach(function(b){b.classList.toggle('on',parseFloat(b.textContent)==w);});
}
function setReps(r){
  PS.reps=r;
  document.querySelectorAll('.rc').forEach(function(b){b.classList.remove('on');});
  var el=document.getElementById('rc-'+r);if(el)el.classList.add('on');
}
function setRIR(r){
  PS.rir=r;
  document.querySelectorAll('.chip').forEach(function(b){b.classList.remove('on');});
  var el=document.getElementById('rir-'+r);if(el)el.classList.add('on');
}
function logSet(){
  if(PS.weight==null){toast('Gewicht eingeben',true);return;}
  if(PS.reps==null){toast('Wiederholungen wählen',true);return;}
  if(PS.rir==null){toast('RIR wählen',true);return;}
  if(!WS.sets[WS.idx])WS.sets[WS.idx]=[];
  WS.sets[WS.idx].push({weight:PS.weight,reps:PS.reps,rir:PS.rir});
  PS={};
  var slot=TEMPLATES[WS.day].slots[WS.idx];
  if(WS.sets[WS.idx].length>=slot.sets){completeSlot();}
  else{renderWorkout();}
}
function removeSet(si){if(WS.sets[WS.idx])WS.sets[WS.idx].splice(si,1);renderWorkout();}

function checkWU(key){
  if(!WS.wuChecked)WS.wuChecked={};
  WS.wuChecked[key]=!WS.wuChecked[key];
  // Save each checked item persistently
  DB.set('wuChecked.'+DB.today(),WS.wuChecked);
  // Check if all done → save wuDone flag
  var wu2=WARMUPS[WS.day];
  if(wu2){
    var wuTotal=wu2.exercises.length+(wu2.warmupSets?wu2.warmupSets.length:0);
    var wuDoneCount=Object.keys(WS.wuChecked).filter(function(k){return WS.wuChecked[k];}).length;
    if(wuDoneCount>=wuTotal){
      DB.set('wuDone.'+DB.today(),true);
      WS.wuDone=true;
    }
  }
  renderWorkout();
}

function finishSetsEarly(){
  if(!WS.partial)WS.partial={};
  WS.partial[WS.idx]=true;
  completeSlot();
  toast('Übung mit weniger Sätzen abgeschlossen');
}

function completeSlot(){
  var sets=WS.sets[WS.idx];
  if(sets&&sets.length){
    var sl=TEMPLATES[WS.day].slots[WS.idx];
    var exN=WS.subs[WS.idx]||bestEx(sl.slot,WS.studio);
    DB.push('hist.'+exN,{date:DB.today(),studio:WS.studio,sets:sets,slot:sl.slot,plannedEx:bestEx(sl.slot,WS.studio),perfEx:exN,subUsed:!!WS.subs[WS.idx]});
  }
  WS.idx++;
  if(WS.idx>=TEMPLATES[WS.day].slots.length&&WS.deferred.length){WS.idx=WS.deferred[0];}
  PS={};
  renderWorkout();
}

function showWOOverview(){
  if(!WS.active)return;
  var tmpl=TEMPLATES[WS.day];
  var html='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0F0F0FEE;z-index:300;overflow-y:auto;padding:20px"><div style="max-width:460px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:18px;color:#E8DDD0">Trainings-Übersicht</div><button onclick="closeOverview()" style="font-size:13px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;padding:7px 14px;border:1px solid #3A3A3A;border-radius:9px">Schließen</button></div>';
  for(var i=0;i<tmpl.slots.length;i++){
    var sl=tmpl.slots[i];var slDef=SLOTS[sl.slot];
    var exN=WS.subs[i]||bestEx(sl.slot,WS.studio);
    var sets=WS.sets[i]||[];
    var isSkipped=WS.skipped.indexOf(i)>-1;
    var isCurrent=i===WS.idx;
    var isDone=sets.length>0&&(!sl.sets||sets.length>=sl.sets);
    var isPartial2=WS.partial&&WS.partial[i];
    var bg=isSkipped?'#2A1A1A':isDone?'#0A1A0A':isPartial2?'#1A1800':isCurrent?'#1A1A2A':'#1E1E1E';
    var bc=isSkipped?'#5A3A3A':isDone?'#2A5A2A':isPartial2?'#4A4A00':isCurrent?'#3A3A6A':'#2E2E2E';
    var isPartial=WS.partial&&WS.partial[i];
    var status=isSkipped?'Übersprungen':isDone?'✓ Fertig':isPartial?'~ Teilweise':isCurrent?'← Aktuell':'';
    var sStr='';if(sets.length){for(var si=0;si<sets.length;si++)sStr+=(si?'  ':'')+sets[si].weight+'kg×'+sets[si].reps;}
    html+='<div style="background:'+bg+';border:1px solid '+bc+';border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:'+(isCurrent?'default':'pointer')+'" onclick="'+(isCurrent?'':'goToSlot('+i+')"')+'"><div><div style="font-size:13px;color:#E8DDD0;font-family:-apple-system,system-ui,sans-serif">'+exN+'</div>'+(sl.sets?'<div style="font-size:11px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;margin-top:2px">'+(sStr||sl.sets+'×'+sl.reps+' geplant')+'</div>':'<div style="font-size:11px;color:#8A8078;font-family:-apple-system,system-ui,sans-serif;margin-top:2px">'+(sl.duration||'')+'</div>')+'</div><div style="font-size:11px;color:'+(isDone?'#60C060':isSkipped?'#C06060':isCurrent?'#8080C0':'#5A5450')+';font-family:-apple-system,system-ui,sans-serif">'+status+'</div></div>';
  }
  html+='</div></div>';
  var div=document.createElement('div');div.id='wo-overview';div.innerHTML=html;document.body.appendChild(div);
}

function closeOverview(){
  var el=document.getElementById('wo-overview');if(el)el.remove();
}

function goToSlot(idx){
  closeOverview();
  WS.idx=idx;
  PS={};
  renderWorkout();
}

function finishWorkout(){
  if(!WS.active)return;
  var tmpl=TEMPLATES[WS.day];
  var total=tmpl.slots.length;
  var done=Object.keys(WS.sets).filter(function(i){return WS.sets[i]&&WS.sets[i].length>0;}).length;
  var skipped=WS.skipped.length;
  var completion=Math.round(((done+skipped)/total)*100);
  var actual=Math.round((done/total)*100);
  DB.set('sessions.'+DB.today(),{day:WS.day,studio:WS.studio,done:true,completion:completion,actual:actual,done_count:done,skipped:skipped,duration:Math.round((Date.now()-WS.startTime)/60000),ts:new Date().toISOString()});
  WS.active=false;
  toast('Gespeichert: '+done+' Übungen / '+completion+'% abgeschlossen');
  NAV('plan');
}

// ---- MOBILITY ----
var _sqTimer=null;
function renderMob(){
  var today=new Date().getDay();
  var dayMap={2:'tuesday',4:'thursday',6:'saturday'};
  var todayKey=dayMap[today]||null;
  var week=Math.max(1,Math.ceil((Object.keys(DB.get('sessions',{})).length||0)/3));
  var sqDur=week<=2?30:week<=4?45:week<=8?60:90;

  var html='<div class="pad"><h2 style="font-size:20px;font-weight:300;color:#E8DDD0;margin-bottom:16px">Mobility</h2>';

function markDSDone(){
  if(_sqTimer){clearInterval(_sqTimer);_sqTimer=null;}
  DB.set('dsDone.'+DB.today(),true);
  toast('Deep Squat erledigt ✓');
  renderMob();
}

function stopDSTimer(){
  if(_sqTimer){clearInterval(_sqTimer);_sqTimer=null;}
  var btn=document.getElementById('ds-btn');
  if(btn){btn.textContent='Timer gestoppt';btn.style.background='';}
}

function startDSTimer(sek){
  if(_sqTimer)clearInterval(_sqTimer);
  var remaining=sek;
  var btn=document.getElementById('ds-btn');
  if(btn)btn.textContent='Timer läuft: '+remaining+'s';
  _sqTimer=setInterval(function(){
    remaining--;
    var b=document.getElementById('ds-btn');
    if(b)b.textContent='Timer läuft: '+remaining+'s';
    if(remaining<=0){
      clearInterval(_sqTimer);_sqTimer=null;
      var b2=document.getElementById('ds-btn');
      if(b2){b2.textContent='Fertig! Gut gemacht';b2.style.background='#1A2A1A';b2.style.borderColor='#3A5A3A';b2.style.color='#80C080';}
      toast('Deep Squat fertig -- '+sek+'s');
      setTimeout(function(){markDSDone();},1500);
    }
  },1000);
}

function markMobEx(key,idx){
  var exDone=DB.get('mobExDone.'+DB.today()+'.'+key,{});
  exDone[idx]=true;
  DB.set('mobExDone.'+DB.today()+'.'+key,exDone);
  // Auto-complete session if all done
  var mob=MOB[key];
  if(mob){
    var allDone=true;
    for(var i=0;i<mob.exercises.length;i++){if(!exDone[i]){allDone=false;break;}}
    if(allDone){
      DB.set('mobDone.'+DB.today()+'.'+key,true);
      toast('Alle Übungen erledigt ✓');

  renderMob();
}

function renderLabeledBars(vals,labels,color,unit,showDelta){
  if(!vals||!vals.length)return'';
  var max=Math.max.apply(null,vals)||1;
  var minV=Math.min.apply(null,vals);
  var hiIdx=vals.indexOf(Math.max.apply(null,vals));
  var html='<div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px">';
  for(var i=0;i<vals.length;i++){
    var pct=Math.round(((vals[i]-minV*0.85)/(max-minV*0.85+1))*65)+10;
    if(pct<10)pct=10;if(pct>75)pct=75;
    var isHi=i===hiIdx;
    var isLast=i===vals.length-1;
    var bg=isHi?color:(isLast?color+'BB':color+'50');
    html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">';
    html+='<div style="font-size:9px;color:'+(isHi?color:(isLast?'#C4A882':'#6A6060'))+';font-family:-apple-system,system-ui,sans-serif;margin-bottom:2px;font-weight:'+(isHi?'600':'400')+'">'+(vals[i]>0?vals[i]:'')+(isHi&&unit?' '+unit:'')+'</div>';
    html+='<div style="width:100%;border-radius:3px 3px 0 0;background:'+bg+';height:'+pct+'px"></div>';
    html+='</div>';
  }
  html+='</div>';
  html+='<div style="display:flex;gap:4px">';
  for(var j=0;j<(labels||[]).length;j++){
    html+='<div style="flex:1;text-align:center;font-size:9px;color:#5A5450;font-family:-apple-system,system-ui,sans-serif;overflow:hidden">'+labels[j]+'</div>';
  }
  html+='</div>';
  if(showDelta&&vals.length>1){
    var first=vals[0];var last=vals[vals.length-1];var delta=last-first;
    var arrow=delta>0?'&#8599;':'&#8600;';
    var deltaColor=delta>0?'#5A9A5A':'#9A5A5A';
    if(delta===0){arrow='&#8594;';deltaColor='#8A8078';}
    html+='<div style="font-size:11px;color:'+deltaColor+';font-family:-apple-system,system-ui,sans-serif;margin-top:6px">'+arrow+' '+(delta>=0?'+':'')+delta+' '+unit+' seit erstem Eintrag</div>';
  }
  return html;
}

function renderStats(){
  var sessions=DB.get('sessions',{});
  var hist=DB.get('hist',{});
  var body=DB.get('bodyMeas',[]);
  var lws=DB.get('lwsLog',[]);
  var dayN=['Mo','Di','Mi','Do','Fr','Sa','So'];

  // --- compute done sessions ---
  var sessKeys=Object.keys(sessions);
  var doneSess=sessKeys.map(function(k){return sessions[k];}).filter(function(s){return s&&s.done;});
  var totalS=doneSess.length;
  var avgComp=totalS?Math.round(doneSess.reduce(function(a,s){return a+(parseInt(s.completion)||0);},0)/totalS):0;

  // --- streak: consecutive weeks with at least 1 training ---
  var weekSet={};
  for(var wi=0;wi<sessKeys.length;wi++){
    var ws=sessions[sessKeys[wi]];
    if(ws&&ws.done){
      var wd=new Date(sessKeys[wi]);
      var wday=wd.getDay();
      var wmon=new Date(wd);wmon.setDate(wd.getDate()-(wday===0?6:wday-1));
      var wkey=wmon.toISOString().split('T')[0];
      weekSet[wkey]=1;
    }
  }
  var weekKeys=Object.keys(weekSet).sort();
  var streak=0;
  if(weekKeys.length>0){
    streak=1;
    for(var si=weekKeys.length-1;si>0;si--){
      var cur=new Date(weekKeys[si]);var prev=new Date(weekKeys[si-1]);
      var diff=(cur-prev)/(1000*60*60*24*7);
      if(diff<=1.5){streak++;}else{break;}
    }
  }

  // --- best week ---
  var weekCount={};
  for(var bi=0;bi<sessKeys.length;bi++){
    var bs=sessions[sessKeys[bi]];
    if(bs&&bs.done){
      var bd=new Date(sessKeys[bi]);var bday=bd.getDay();
      var bmon=new Date(bd);bmon.setDate(bd.getDate()-(bday===0?6:bday-1));
      var bkey=bmon.toISOString().split('T')[0];
      weekCount[bkey]=(weekCount[bkey]||0)+1;
    }
  }
  var bestWeek=0;
  var bwkeys=Object.keys(weekCount);
  for(var bwi=0;bwi<bwkeys.length;bwi++){if(weekCount[bwkeys[bwi]]>bestWeek)bestWeek=weekCount[bwkeys[bwi]];}

  // --- Hip Thrust data ---
  var htEx=['Hip Thrust Maschine','Booty Builder Hip Thrust Elite','Booty Builder Dual Hip Thrust','Barbell Hip Thrust'];
  var htData=[];
  for(var hi=0;hi<htEx.length;hi++){
    var hh=hist[htEx[hi]]||[];
    for(var hj=0;hj<hh.length;hj++){if(hh[hj].sets&&hh[hj].sets.length)htData.push(hh[hj]);}
  }
  htData.sort(function(a,b){return a.date>b.date?1:-1;});
  var htVals=htData.map(function(h){return Math.max.apply(null,h.sets.map(function(s){return parseFloat(s.weight)||0;}))||0;});
  var htLbls=htData.map(function(h){return h.date?h.date.slice(5):''});
  var htMax=htVals.length?Math.max.apply(null,htVals):0;
  var htCur=htVals.length?htVals[htVals.length-1]:0;
  var htFirst=htVals.length?htVals[0]:0;
  var htDelta=htMax-htFirst;

  // --- volume per session (total sets) ---
  var volEx=Object.keys(hist);
  var volByDate={};
  for(var vi=0;vi<volEx.length;vi++){
    var ve=hist[volEx[vi]]||[];
    for(var vj=0;vj<ve.length;vj++){
      var vdate=ve[vj].date;
      if(vdate&&ve[vj].sets){volByDate[vdate]=(volByDate[vdate]||0)+ve[vj].sets.length;}
    }
  }
  var volKeys=Object.keys(volByDate).sort().slice(-8);
  var volVals=volKeys.map(function(k){return volByDate[k];});
  var volLbls=volKeys.map(function(k){return k.slice(5);});

  // --- strength development: best weight per exercise across all sessions ---
  // Group exercises by category
  var strengthGroups=[
    {label:'Hip Thrust',color:'#C4A882',exNames:['Hip Thrust Maschine','Booty Builder Hip Thrust Elite','Booty Builder Dual Hip Thrust','Barbell Hip Thrust']},
    {label:'Squat / Leg Press',color:'#A882C4',exNames:['Belt Squat','Hack Squat','Pendulum Squat','Leg Press','45° Leg Press','Horizontal Leg Press']},
    {label:'Leg Curl / Extension',color:'#82A8C4',exNames:['Seated Leg Curl','Lying Leg Curl','Leg Extension']},
    {label:'Abduktor / Kickback',color:'#C48A82',exNames:['Abduktionsmaschine','Booty Builder 3D Multi Abductor','Booty Builder Pendulum Kickback','Booty Builder Kneeling Glute Isolator']},
    {label:'Oberkörper',color:'#A8C482',exNames:['Lat Pulldown','Seated Row','Chest-Supported Row','Incline Chest Press','Dumbbells','Barbell','Smith Machine','Cable Station']}
  ];
  // For each group, collect per-exercise best-weight-per-session timeline
  // Build a map: exName -> [{date,maxW}] sorted
  var exTimelines={};
  var allExNames=Object.keys(hist);
  for(var eti=0;eti<allExNames.length;eti++){
    var exn=allExNames[eti];
    var exEntries=hist[exn]||[];
    var byDate2={};
    for(var etj=0;etj<exEntries.length;etj++){
      var ee=exEntries[etj];
      if(!ee.date||!ee.sets||!ee.sets.length)continue;
      var mw=0;
      for(var sk=0;sk<ee.sets.length;sk++){var sw=parseFloat(ee.sets[sk].weight)||0;if(sw>mw)mw=sw;}
      if(mw>0){if(!byDate2[ee.date]||byDate2[ee.date]<mw)byDate2[ee.date]=mw;}

// Override bestEx to use studio equipment
function bestEx(slot,studioId){
  var pref=DB.get('pref.'+studioId+'.'+slot,null);
  if(pref&&SLOTS[slot]&&SLOTS[slot].howto&&SLOTS[slot].howto[pref])return pref;
  var studios=getStudios();var studio=studios[studioId];
  if(!studio||!studio.eq||!studio.eq.length)return SLOTS[slot]?SLOTS[slot].def:'';
  var slotDef=SLOTS[slot];if(!slotDef)return'';
  // Check if default is available
  var eq=studio.eq;
  var defEx=slotDef.def;
  // Look for default or tier 1 alt in equipment list
  var allOpts=[defEx].concat(slotDef.alts||[]);
  for(var i=0;i<allOpts.length;i++){
    var opt=allOpts[i];
    // Check if this exercise's equipment is in studio
    if(eq.indexOf(opt)>-1)return opt;
    // Check by slot mapping
    var slotForEquip=EQUIP_SLOT_MAP[opt];
    if(slotForEquip===slot&&eq.some(function(e){return EQUIP_SLOT_MAP[e]===slot;})){
      // Find which specific equipment matches
      for(var j=0;j<eq.length;j++){if(EQUIP_SLOT_MAP[eq[j]]===slot)return eq[j];}
    }
  }
  return defEx; // fallback
}

function importData(evt){
  var file=evt.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var parsed=JSON.parse(e.target.result);
      if(!parsed.data||!parsed.app||parsed.app.indexOf('strength-grace')<0){toast('Ungültige Datei',true);return;}
      var cur=DB.load();
      // Merge sessions -- keep both, current wins on conflict by date key
      var mergedSess=Object.assign({},parsed.data.sessions||{},cur.sessions||{});
      // Merge hist -- combine arrays, dedupe by date
      var mergedHist={};
      var allHKeyArr2=Object.keys(parsed.data.hist||{}).concat(Object.keys(cur.hist||{}));var allHKeys=allHKeyArr2.filter(function(v,i){return allHKeyArr2.indexOf(v)===i;});
      allHKeys.forEach(function(k){
        var old=(parsed.data.hist||{})[k]||[];var curr=(cur.hist||{})[k]||[];
        var merged=old.filter(function(x){return !curr.some(function(y){return y.date===x.date;});}).concat(curr);
        merged.sort(function(a,b){return a.date>b.date?1:-1;});
        mergedHist[k]=merged;
      });
      // Build final: start with parsed, overlay cur for non-session keys, then set merged sessions+hist
      var final=Object.assign({},parsed.data,cur,{sessions:mergedSess,hist:mergedHist});
      DB.save(final);
      toast('Import erfolgreich');
      renderPlan();
      renderMore();
    }catch(err){toast('Fehler beim Import',true);}
  };
  reader.readAsText(file);evt.target.value='';
}
